<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEUS — ULTRA PROMAX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #f5f0e8;
            --bg-panel: rgba(255, 253, 249, 0.9);
            --bg-card: rgba(248, 244, 237, 0.82);
            --bg-input: rgba(240, 235, 225, 0.78);
            --ink: #1e1c18;
            --ink-2: #4a4640;
            --ink-faint: #7c766a;
            --gold: #b8942e;
            --gold-deep: #96761e;
            --gold-light: #d9b84a;
            --gold-soft: rgba(184, 148, 46, 0.14);
            --gold-shimmer: linear-gradient(135deg, #b8942e 0%, #d9b84a 45%, #9f7d25 100%);
            --line: rgba(184, 148, 46, 0.16);
            --success: #1a8a4a;
            --danger: #d93025;
            --radius-card: 22px;
            --radius-input: 15px;
            --font-main: 'Zain', sans-serif;
            --transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }

        [data-theme="dark"] {
            --bg-body: #110f0d;
            --bg-panel: rgba(24, 21, 18, 0.96);
            --bg-card: rgba(38, 34, 29, 0.84);
            --bg-input: rgba(48, 43, 37, 0.82);
            --ink: #f0ebe1;
            --ink-2: #c2b9aa;
            --ink-faint: #877f71;
            --line: rgba(184, 148, 46, 0.14);
            --gold-soft: rgba(184, 148, 46, 0.13);
        }

        body {
            background: var(--bg-body);
            color: var(--ink);
            font-family: var(--font-main);
            font-size: 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.65;
            transition: background 0.3s, color 0.3s;
        }

        .panel {
            max-width: 880px;
            width: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(18px);
            border-radius: var(--radius-card);
            border: 1px solid var(--line);
            padding: 30px 34px;
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.08);
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--line);
            padding-bottom: 18px;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand-lock-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 16px;
            transition: var(--transition);
            user-select: none;
        }

        .brand-lock-btn:hover {
            background: var(--gold-soft);
        }

        .zeus-emblem {
            width: 58px;
            height: 58px;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            background: var(--gold-shimmer);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .brand-sub {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-faint);
            text-align: right;
        }

        .meta-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            font-size: 14px;
            font-weight: 700;
            color: var(--ink-2);
            font-variant-numeric: tabular-nums;
        }

        .meta-pill svg {
            width: 18px;
            height: 18px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .theme-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            color: var(--ink-2);
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .theme-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 22px;
        }

        @media (max-width: 640px) {
            .panel { padding: 20px 16px; }
            .grid { grid-template-columns: 1fr; gap: 14px; }
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 20px;
            border: 1px solid var(--line);
            margin-top: 18px;
        }

        .grid .card {
            margin-top: 0;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title-wrap svg {
            width: 20px;
            height: 20px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--ink);
        }

        .input-box {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: var(--radius-input);
            padding: 0 14px;
            border: 1px solid var(--line);
            transition: var(--transition);
        }

        .input-box:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-soft);
        }

        .input-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 12px 0;
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
            min-width: 0;
        }

        .action-row {
            display: flex;
            justify-content: center;
            margin: 24px 0 20px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 36px;
            border: none;
            border-radius: 999px;
            background: var(--gold-shimmer);
            color: #fff;
            font-family: var(--font-main);
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(184, 148, 46, 0.28);
            transition: var(--transition);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(184, 148, 46, 0.38);
        }

        .btn-primary svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .output-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            background: var(--bg-input);
            border: 1px solid var(--line);
            border-radius: var(--radius-card);
            padding: 16px 20px;
        }

        .token-badge {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--gold-deep);
        }

        [data-theme="dark"] .token-badge {
            color: var(--gold-light);
        }

        .link-preview {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-faint);
            word-break: break-all;
            margin-top: 2px;
        }

        .icon-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            border: 1px solid var(--line);
            background: var(--bg-card);
            color: var(--ink-2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .icon-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .icon-btn svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(12, 10, 8, 0.72);
            backdrop-filter: blur(12px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-card {
            max-width: 420px;
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-card);
            padding: 26px 24px;
            text-align: center;
        }

        .modal-card h3 {
            font-size: 22px;
            font-weight: 900;
            color: var(--gold-deep);
            margin-bottom: 6px;
        }

        .modal-card p {
            font-size: 14px;
            color: var(--ink-faint);
            margin-bottom: 16px;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }

        .btn-sec {
            padding: 9px 22px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--bg-input);
            color: var(--ink-2);
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-conf {
            padding: 9px 24px;
            border-radius: 999px;
            border: none;
            background: var(--gold-shimmer);
            color: #fff;
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .error-text {
            color: var(--danger);
            font-size: 14px;
            font-weight: 700;
            margin-top: 10px;
            display: none;
        }

        .error-text.show {
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--ink);
            color: #fff;
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="modal-backdrop" id="secretModal">
        <div class="modal-card">
            <h3>الباب السري — ZEUS</h3>
            <p>أدخل رمز الوصول الخاص باللوحة</p>
            <div class="input-box">
                <input type="password" id="secretCodeInput" placeholder="أدخل الرمز …" autocomplete="off" />
            </div>
            <div class="error-text" id="secretError">الرمز غير صحيح</div>
            <div class="modal-btns">
                <button class="btn-conf" id="confirmSecretBtn">تأكيد</button>
                <button class="btn-sec" id="cancelSecretBtn">إغلاق</button>
            </div>
        </div>
    </div>

    <main class="panel">
        <header class="top">
            <button type="button" class="brand-lock-btn" id="zeusSecretBrand" title="رمز الباب السري مدمج في الشعار">
                <!-- شعار ZEUS التقني مع رمز مفتاح/قفل الباب السري مدمج في قلب الشعار -->
                <svg class="zeus-emblem" viewBox="0 0 64 64" fill="none" aria-label="شعار ZEUS">
                    <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="#b8942e" stroke-width="2.4" fill="rgba(184,148,46,0.08)" />
                    <polygon points="32,10 50,21 50,43 32,54 14,43 14,21" stroke="#d9b84a" stroke-width="1.2" stroke-dasharray="4 3" />
                    <!-- تجويف القفل المدمج في مركز الشعار -->
                    <circle cx="32" cy="28" r="5.5" stroke="#b8942e" stroke-width="2.2" />
                    <path d="M32 33.5V43.5M32 38.5H36.5" stroke="#b8942e" stroke-width="2.4" stroke-linecap="round" />
                </svg>
                <div>
                    <span class="brand-title">ZEUS</span>
                    <span class="brand-sub">إدارة التوكنات وقاعدة البيانات</span>
                </div>
            </button>

            <div class="meta-bar">
                <div class="meta-pill" title="توقيت القاهرة — نظام 12 ساعة">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 7v5l3.5 2" stroke-linecap="round" />
                    </svg>
                    <span id="cairoClock12">--:--:-- AM</span>
                </div>

                <div class="meta-pill" title="تاريخ القاهرة">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="16" rx="2.5" />
                        <path d="M8 3v4M16 3v4M3 10h18" stroke-linecap="round" />
                    </svg>
                    <span id="cairoDate">--/--/----</span>
                </div>

                <button type="button" class="theme-btn" id="themeSwitchBtn">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="4.5" />
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-linecap="round" />
                    </svg>
                    <span id="themeText">فاتح</span>
                </button>
            </div>
        </header>

        <section class="grid">
            <div class="card">
                <div class="card-head">
                    <div class="card-title-wrap">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="4" width="18" height="16" rx="3" />
                            <circle cx="12" cy="10.5" r="2.5" />
                            <path d="M7.5 17.5c1.5-2 7.5-2 9 0" stroke-linecap="round" />
                        </svg>
                        <span class="card-title">معرّف المستلم (Chat ID)</span>
                    </div>
                </div>
                <div class="input-box">
                    <input type="text" id="chatIdField" placeholder="أدخل المعرّف الرقمي …" dir="ltr" />
                </div>
            </div>

            <div class="card">
                <div class="card-head">
                    <div class="card-title-wrap">
                        <svg viewBox="0 0 24 24">
                            <path d="M15 7a4 4 0 1 0-3.87 5H15l2 2 2-2 2 2 1-1-3-3h-4" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <span class="card-title">توكن البوت (Bot Token)</span>
                    </div>
                </div>
                <div class="input-box">
                    <input type="password" id="botTokenField" placeholder="أدخل التوكن السري …" dir="ltr" />
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-head">
                <div class="card-title-wrap">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 13a5 5 0 0 0 7.54.54l2.92-2.92a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke-linecap="round" />
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-2.92 2.92a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke-linecap="round" />
                    </svg>
                    <span class="card-title">الرابط الأساسي (Base URL)</span>
                </div>
            </div>
            <div class="input-box">
                <input type="url" id="baseUrlField" placeholder="https://example.com" dir="ltr" />
            </div>
        </section>

        <div class="action-row">
            <button type="button" class="btn-primary" id="createTokenBtn">
                <svg viewBox="0 0 24 24">
                    <polygon points="12,3 21,8.5 21,15.5 12,21 3,15.5 3,8.5" />
                    <path d="M12 8v8M8 12h8" stroke-linecap="round" />
                </svg>
                <span>إنشاء توكن ورابط آمن</span>
            </button>
        </div>

        <section class="card" style="margin-top: 0;">
            <div class="card-head">
                <div class="card-title-wrap">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="16" rx="2.5" />
                        <path d="M7 9h10M7 13h6" stroke-linecap="round" />
                    </svg>
                    <span class="card-title">الرابط العام والتوكن الفريد</span>
                </div>
            </div>
            <div class="output-box">
                <div>
                    <div class="token-badge" id="generatedTokenText">لم يُنشأ بعد</div>
                    <div class="link-preview" id="generatedLinkText">يظهر الرابط القصير هنا دون كشف بيانات الاعتماد</div>
                </div>
                <div class="icon-actions">
                    <button type="button" class="icon-btn" id="copyResultBtn" title="نسخ الرابط">
                        <svg viewBox="0 0 24 24">
                            <rect x="8" y="8" width="12" height="12" rx="2" />
                            <path d="M5 15V5a2 2 0 0 1 2-2h10" stroke-linecap="round" />
                        </svg>
                    </button>
                    <button type="button" class="icon-btn" id="openResultBtn" title="فتح الرابط">
                        <svg viewBox="0 0 24 24">
                            <path d="M14 4h6v6M20 4l-9 9" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M18 13v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" stroke-linecap="round" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            "use strict";

            const GSHEET_URL = "https://script.google.com/macros/s/AKfycby8goJYYKtOM_EL7HchLK_XDq8vUMU0lmlQtCmrZYlNk5NgITn_uVg8gmM-rXK8kHs/exec";

            function showToast(message) {
                const el = document.getElementById("toast");
                if (!el) return;
                el.textContent = message;
                el.classList.add("show");
                clearTimeout(el._t);
                el._t = setTimeout(() => el.classList.remove("show"), 2600);
            }

            // 1) الساعة بنظام 12 ساعة AM/PM بتوقيت القاهرة مع انتقال صحيح من 12 إلى 1
            function formatCairo12Hour(dateObj) {
                const cairoParts = new Intl.DateTimeFormat("en-US", {
                    timeZone: "Africa/Cairo",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                }).formatToParts(dateObj);

                let hour = "12";
                let minute = "00";
                let second = "00";
                let period = "AM";

                for (const part of cairoParts) {
                    if (part.type === "hour") hour = part.value;
                    else if (part.type === "minute") minute = part.value;
                    else if (part.type === "second") second = part.value;
                    else if (part.type === "dayPeriod") period = part.value.toUpperCase();
                }

                return `${hour}:${minute}:${second} ${period}`;
            }

            function formatCairoDate(dateObj) {
                return new Intl.DateTimeFormat("en-GB", {
                    timeZone: "Africa/Cairo",
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }).format(dateObj);
            }

            function refreshClock() {
                const now = new Date();
                const clockEl = document.getElementById("cairoClock12");
                const dateEl = document.getElementById("cairoDate");
                if (clockEl) clockEl.textContent = formatCairo12Hour(now);
                if (dateEl) dateEl.textContent = formatCairoDate(now);
            }

            refreshClock();
            setInterval(refreshClock, 1000);

            // 2) السمة (فاتح / داكن)
            const themeBtn = document.getElementById("themeSwitchBtn");
            const themeText = document.getElementById("themeText");
            let theme = localStorage.getItem("zeus_ui_theme") || "light";

            function applyTheme(nextTheme) {
                theme = nextTheme;
                if (theme === "dark") {
                    document.documentElement.setAttribute("data-theme", "dark");
                    themeText.textContent = "داكن";
                } else {
                    document.documentElement.removeAttribute("data-theme");
                    themeText.textContent = "فاتح";
                }
                localStorage.setItem("zeus_ui_theme", theme);
            }

            applyTheme(theme);
            themeBtn.addEventListener("click", () => applyTheme(theme === "light" ? "dark" : "light"));

            // 3) رمز الباب السري المدمج داخل شعار ZEUS
            const brandBtn = document.getElementById("zeusSecretBrand");
            const secretModal = document.getElementById("secretModal");
            const secretCodeInput = document.getElementById("secretCodeInput");
            const secretError = document.getElementById("secretError");
            let brandClicks = 0;
            let clickResetTimer = null;

            function openSecretModal() {
                secretError.classList.remove("show");
                secretCodeInput.value = "";
                secretModal.classList.add("active");
                secretCodeInput.focus();
            }

            brandBtn.addEventListener("click", () => {
                brandClicks += 1;
                clearTimeout(clickResetTimer);
                clickResetTimer = setTimeout(() => {
                    brandClicks = 0;
                }, 500);
                if (brandClicks >= 3) {
                    brandClicks = 0;
                    openSecretModal();
                }
            });

            document.addEventListener("keydown", (e) => {
                if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "d") {
                    e.preventDefault();
                    openSecretModal();
                }
            });

            document.getElementById("cancelSecretBtn").addEventListener("click", () => {
                secretModal.classList.remove("active");
            });

            document.getElementById("confirmSecretBtn").addEventListener("click", () => {
                const entered = secretCodeInput.value.trim();
                const expected = sessionStorage.getItem("zeus_session_access_code") || "ZEUS-ADMIN-2026";
                if (entered && entered === expected) {
                    secretModal.classList.remove("active");
                    showToast("تم التحقق من رمز الباب السري");
                } else {
                    secretError.classList.add("show");
                }
            });

            // 4) توليد توكن فريد غير مكرر بدون كشف بيانات الاعتماد في الرابط
            async function createUniqueToken(seedInput) {
                const existing = JSON.parse(localStorage.getItem("zeus_registered_tokens") || "[]");
                const existingSet = new Set(existing.map((item) => String(item.shortToken).toUpperCase()));
                const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

                for (let attempt = 0; attempt < 10; attempt++) {
                    const randomBytes = new Uint32Array(6);
                    crypto.getRandomValues(randomBytes);
                    const raw = `${seedInput}:${Date.now()}:${attempt}:${Array.from(randomBytes).join("-")}`;
                    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
                    const bytes = new Uint8Array(digest);
                    let token = "";
                    for (let i = 0; i < 6; i++) {
                        token += alphabet[bytes[i] % alphabet.length];
                    }
                    if (!existingSet.has(token)) {
                        return token;
                    }
                }
                throw new Error("Unable to generate a unique token");
            }

            async function syncTokenToSheet(record) {
                if (!GSHEET_URL) return null;
                try {
                    const res = await fetch(GSHEET_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "register_bot",
                            bot: record
                        })
                    });
                    return await res.json();
                } catch (err) {
                    return null;
                }
            }

            const createBtn = document.getElementById("createTokenBtn");
            const tokenText = document.getElementById("generatedTokenText");
            const linkText = document.getElementById("generatedLinkText");

            createBtn.addEventListener("click", async () => {
                const chatId = document.getElementById("chatIdField").value.trim();
                const botToken = document.getElementById("botTokenField").value.trim();
                const baseUrl = document.getElementById("baseUrlField").value.trim();

                if (!chatId || !botToken || !baseUrl) {
                    showToast("يرجى إدخال المعرّف والتوكن والرابط الأساسي");
                    return;
                }

                try {
                    new URL(baseUrl);
                } catch {
                    showToast("الرابط الأساسي غير صالح");
                    return;
                }

                const shortToken = await createUniqueToken(`${chatId}:${botToken}:${baseUrl}`);
                const cleanBase = `${window.location.origin}${window.location.pathname}`;
                const publicLink = `${cleanBase}?t=${encodeURIComponent(shortToken)}`;

                const list = JSON.parse(localStorage.getItem("zeus_registered_tokens") || "[]");
                const entry = {
                    shortToken,
                    chatId,
                    botToken,
                    baseUrl,
                    active: true,
                    createdAt: Date.now()
                };
                list.push(entry);
                localStorage.setItem("zeus_registered_tokens", JSON.stringify(list));

                await syncTokenToSheet({
                    shortToken,
                    chatId,
                    baseUrl,
                    active: true,
                    createdAt: entry.createdAt
                });

                tokenText.textContent = shortToken;
                linkText.textContent = publicLink;
                showToast("تم إنشاء التوكن وحفظه بنجاح");
            });

            document.getElementById("copyResultBtn").addEventListener("click", () => {
                const val = linkText.textContent.trim();
                if (!val || !val.includes("?t=")) {
                    showToast("أنشئ رابطًا أولًا");
                    return;
                }
                navigator.clipboard?.writeText(val).then(() => showToast("تم نسخ الرابط")).catch(() => {});
            });

            document.getElementById("openResultBtn").addEventListener("click", () => {
                const val = linkText.textContent.trim();
                if (!val || !val.includes("?t=")) {
                    showToast("أنشئ رابطًا أولًا");
                    return;
                }
                window.open(val, "_blank", "noopener,noreferrer");
            });

            // إتاحة دالة اختبار الساعة 12 ساعة في console
            window.testCairo12HourTransitions = function () {
                const samples = [
                    new Date("2026-11-27T10:59:59Z"), // 12:59:59 AM Cairo
                    new Date("2026-11-27T11:00:00Z"), // 01:00:00 AM Cairo
                    new Date("2026-11-27T09:59:59Z"), // 11:59:59 PM Cairo (previous day)
                    new Date("2026-11-27T10:00:00Z")  // 12:00:00 AM Cairo
                ];
                return samples.map((d) => ({ utc: d.toISOString(), cairo12h: formatCairo12Hour(d) }));
            };
        })();
    </script>
